name: hermes-cloud-file-manager
version: 0.1.0
description: "Cloud Files for Hermes Desktop: browse, search, create folders and bulk-upload files and whole folders to the machine your agent runs on, and hand the agent file locations from the chat + menu without re-uploading."
author: Electric Sheep
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.1"
license: MIT
homepage: https://github.com/electricsheephq/hermes-cloud-file-manager
tags: [desktop, files, upload, remote, workspace]
config_schema:
  roots:
    type: list
    default: []
    description: "Absolute folders on the agent's machine to show in Cloud Files. Empty = the agent's workspace (terminal.cwd, else the gateway user's home)."
  folder_notes:
    type: dict
    default: {}
    description: "Optional short note shown next to a top-level folder, by folder name (e.g. docs: Imported into the agent's knowledge base)."
  max_file_mb:
    type: int
    default: 100
    description: "Largest single file the upload accepts, in MiB."
provides_tools: []
provides_hooks: []
