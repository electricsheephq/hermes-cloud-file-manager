name: hermes-cloud-file-manager
version: 0.3.7
description: "Cloud Files for Hermes Desktop: browse, search, create folders and bulk-upload files and whole folders to the machine your agent runs on, read and edit its Markdown files with an explicit Save, import files from its Google Drive, and hand the agent file locations from the chat + menu without re-uploading."
author: Electric Sheep
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
license: MIT
homepage: https://github.com/electricsheephq/hermes-cloud-file-manager
tags: [desktop, files, upload, remote, workspace]
config_schema:
  roots:
    type: list
    label: "Folders to show"
    default: []
    description: "Absolute folders on the agent's machine to show in Cloud Files, as a JSON list, e.g. [\"/home/me/projects\"]. Empty = the agent's working folder (terminal.cwd, else the TERMINAL_CWD or MESSAGING_CWD the gateway runs with), else the gateway user's home."
  folder_notes:
    type: dict
    label: "Folder notes"
    default: {}
    description: "Optional short note shown next to a top-level folder, by folder name, as JSON, e.g. {\"docs\": \"Imported into the agent's knowledge base\"}."
  max_file_mb:
    type: int
    label: "Largest upload (MiB)"
    default: 100
    description: "Largest single file the upload accepts, in whole MiB. Decimals are rounded down; a value under 1 falls back to 100."
provides_tools: []
provides_hooks: []
